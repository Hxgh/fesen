[package]
name = "fesen-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
netstack-smoltcp = "=0.2.4"
fesen-acl.workspace = true
fesen-proto.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
socket2 = "0.6"
tokio.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tokio-util.workspace = true
url.workspace = true
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"
