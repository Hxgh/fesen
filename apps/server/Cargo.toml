[package]
name = "fesen-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
axum.workspace = true
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] }
hex = "0.4"
fesen-acl.workspace = true
fesen-proto.workspace = true
rand.workspace = true
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
futures-util.workspace = true
netstack-smoltcp = "=0.2.4"
fesen-core = { path = "../core" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
socket2 = "0.6"
tempfile = "3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
