<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title></title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="identity">
        <a id="brand-badge" class="brand-badge" href="/admin/"><span id="brand-mark"></span></a>
        <span id="brand-word" class="brand-word" hidden><span data-copy="brand"></span><span class="brand-sub" data-copy="admin_badge"></span></span>
        <nav id="nav-tabs" class="tabs topbar-tabs" hidden></nav>
      </div>
      <div id="actions" class="toolbar"></div>
    </div>
  </header>

  <main class="wrap workspace">
    <p id="loading" class="loading" role="status" data-copy="loading"></p>
    <section id="signin" class="signin" aria-labelledby="login-title" hidden>
      <form id="login" class="stack">
        <h1 id="login-title" class="form-title" data-copy="login_title"></h1>
        <label><span data-copy="account"></span><input name="username" autocomplete="username" required maxlength="64"></label>
        <label><span data-copy="password"></span><input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
        <p id="login-error" class="feedback error" role="alert" hidden></p>
        <button class="button primary" type="submit" data-copy="login"></button>
      </form>
    </section>
    <div id="content" hidden></div>
  </main>

  <dialog id="editor" tabindex="-1" aria-labelledby="editor-title"></dialog>
  <dialog id="settings-dialog" tabindex="-1" aria-labelledby="settings-heading"></dialog>
</body>
</html>
