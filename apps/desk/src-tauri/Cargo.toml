[package]
name = "fesen"
version = "0.1.6"
edition = "2024"
rust-version = "1.90"

[lib]
name = "fesen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "stream", "json", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(any(windows, target_os = "android", target_os = "macos"))'.dependencies]
fesen-core = { path = "../../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tauri-plugin-fesen = { path = "mobile" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release.build-override]
# macOS dyld must load host proc macros, including when building Android.
strip = "none"
