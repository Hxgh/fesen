[workspace]
members = ["apps/server", "apps/core", "packages/acl", "packages/proto"]
resolver = "2"
exclude = ["apps/desk/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }
fesen-acl = { path = "packages/acl" }
fesen-proto = { path = "packages/proto" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-util = "0.7"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
